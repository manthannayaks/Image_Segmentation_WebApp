<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Segmentation Tool</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🧩 Image Segmentation Demo</h1>

        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="image" name="image" accept="image/*" required>
            <button type="submit">Segment Image</button>
        </form>

        <div id="result">
            <h3>Output:</h3>
            <div class="image-pair">
                <div>
                    <h4>Average-Color Segmentation</h4>
                    <img id="smooth" src="" alt="Smooth Segmented Image" />
                </div>
                <div>
                    <h4>Random-Color Segmentation</h4>
                    <img id="random" src="" alt="Random Segmented Image" />
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('upload-form');
        const smoothImg = document.getElementById('smooth');
        const randomImg = document.getElementById('random');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('image').files[0];
            if (!file) return alert("Please select an image first.");

            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch('/segment', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                smoothImg.src = data.smooth + '?t=' + new Date().getTime();
                randomImg.src = data.random + '?t=' + new Date().getTime();
            } else {
                alert("Error: Unable to process the image.");
            }
        });
    </script>
</body>
</html>
